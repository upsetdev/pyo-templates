name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A contributor's pull request is checked by the rules on main, or it
      # could weaken the validator that's about to judge it.
      - name: Use the base branch's checks
        if: >-
          github.event_name == 'pull_request' &&
          !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        run: git checkout "${{ github.event.pull_request.base.sha }}" -- scripts schema.json template.schema.json package.json bun.lock
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run validate
      - run: bun run build
      - name: Check who changed what
        if: github.event_name == 'pull_request'
        run: bun run check-pr
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
