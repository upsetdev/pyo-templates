# yaml-language-server: $schema=../../schema.json
x-pyo:
  name: Directus
  description: Instant REST and GraphQL APIs and a no-code admin app for a Postgres database.
  category: developer-tools
  logo: logo.svg
  tier: official
  author: upsetdev
  homepage: https://directus.io
  version: 1.0.0
  appVersion: "12.6.1"
  minPyoVersion: 0.1.0
  kind: application
  generate:
    - { key: SECRET, format: long }
    - ADMIN_PASSWORD
  fields:
    - key: email
      label: Admin email
      type: text
      default: admin@example.com
      required: true
      envKey: ADMIN_EMAIL
    - key: password
      label: Admin password
      type: password
      required: false
      sensitive: true
      envKey: ADMIN_PASSWORD
      help: Leave empty to generate one.
  # Postgres direct (its migrations run on start), and KV for its cache.
  databases:
    - engine: postgres
      env:
        DB_CONNECTION_STRING: DATABASE_URL_DIRECT
    - engine: kv
      env:
        REDIS: REDIS_URL
  hints:
    - Add a domain, then sign in with the admin email and ADMIN_PASSWORD from its variables.
    - Uploads are kept on its volume.

services:
  directus:
    image: docker.io/directus/directus:12.6.1@sha256:e1561b5e526e8e7a2ac19b7bb6eab63611dd84a862a8c45b864118768a2baff4
    environment:
      SECRET:
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD:
      PUBLIC_URL: $${{self.PUBLIC_URL}}
      DB_CLIENT: pg
      CACHE_ENABLED: "true"
      CACHE_STORE: redis
      CACHE_AUTO_PURGE: "true"
      TELEMETRY: "false"
      # Only for docker compose: Pyo connects its own databases instead.
      DB_CONNECTION_STRING: postgres://directus:directus@db:5432/directus
      REDIS: redis://kv:6379
    volumes:
      - data:/directus/uploads
    expose: [ "8055" ]
    healthcheck:
      start_period: 30s
      interval: 10s
      x-pyo: { tcp: 8055 }
    deploy:
      replicas: 1
      resources:
        reservations: { cpus: "0.25", memory: 256M }
        limits: { cpus: "1", memory: 1G }
    x-pyo:
      expose:
        - { name: http, port: 8055, as: http }
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    profiles: [ local ]
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus
  kv:
    image: docker.io/valkey/valkey:8-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    profiles: [ local ]

volumes:
  data:
    x-pyo: { sizeGi: 5 }
