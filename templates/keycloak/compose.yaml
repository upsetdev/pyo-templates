# yaml-language-server: $schema=../../schema.json
x-pyo:
  name: Keycloak
  description: Identity and access management with single sign-on, OpenID Connect and SAML.
  category: other
  logo: logo.svg
  tier: official
  author: upsetdev
  homepage: https://www.keycloak.org
  version: 1.0.0
  appVersion: "26.8.2"
  minPyoVersion: 0.1.0
  kind: application
  generate:
    - KC_BOOTSTRAP_ADMIN_PASSWORD
  fields:
    - key: admin
      label: Admin user
      type: text
      default: admin
      required: true
      envKey: KC_BOOTSTRAP_ADMIN_USERNAME
  database:
    engine: postgres
    env:
      KC_DB_URL_HOST: POSTGRES_HOST
      KC_DB_URL_PORT: POSTGRES_PORT
      KC_DB_URL_DATABASE: POSTGRES_DATABASE
      KC_DB_USERNAME: POSTGRES_USER
      KC_DB_PASSWORD: POSTGRES_PASSWORD
  hints:
    - "Needs a domain: it's the hostname Keycloak issues tokens for."
    - Sign in to the admin console with the admin user and KC_BOOTSTRAP_ADMIN_PASSWORD, then create a permanent admin; the bootstrap one is temporary.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
    # Production mode, behind the Gateway: it ends TLS and sets X-Forwarded-*.
    command: [ start ]
    environment:
      KC_DB: postgres
      KC_HOSTNAME: $${{self.PUBLIC_URL}}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD:
    expose: [ "8080" ]
    healthcheck:
      start_period: 90s
      interval: 15s
      # On its management port.
      x-pyo: { http: { path: /health/ready, port: 9000 } }
    deploy:
      replicas: 1
      resources:
        reservations: { cpus: "0.5", memory: 768M }
        limits: { cpus: "2", memory: 2G }
    x-pyo:
      expose:
        - { name: http, port: 8080, as: http }
