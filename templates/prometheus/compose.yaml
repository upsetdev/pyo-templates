# yaml-language-server: $schema=../../schema.json
x-pyo:
  name: Prometheus
  description: Metrics collection and alerting with local time-series storage.
  category: monitoring
  logo: logo.svg
  tier: official
  author: upsetdev
  homepage: https://prometheus.io
  version: 1.0.0
  appVersion: "3.1.0"
  minPyoVersion: 0.1.0
  kind: service
  featured: true
  fields:
    - key: retention
      label: Retention
      type: select
      default: 15d
      options:
        - 7d
        - 15d
        - 30d
        - 90d
      required: true
    - key: scrapeInterval
      label: Scrape interval
      type: select
      default: 30s
      options:
        - 15s
        - 30s
        - 60s
      required: true
  hints:
    - Size the volume for retention × ingest rate.
    - Has no authentication; keep it internal or put it behind an authenticating proxy.
services:
  prometheus:
    image: quay.io/prometheus/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    volumes:
      - data:/prometheus
    expose:
      - "9090"
    healthcheck:
      start_period: 10s
      interval: 10s
      x-pyo:
        http:
          path: /-/healthy
          port: 9090
    deploy:
      replicas: 1
      resources:
        reservations:
          cpus: "0.25"
          memory: 1G
        limits:
          cpus: "1"
          memory: 2G
    x-pyo:
      expose:
        - name: web
          port: 9090
          as: internal
          protocol: http
volumes:
  data:
    x-pyo:
      sizeGi: 20
