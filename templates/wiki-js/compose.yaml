# yaml-language-server: $schema=../../schema.json
x-pyo:
  name: Wiki.js
  description: Modern wiki with a visual and Markdown editor, page history and Git sync, on Postgres.
  category: web
  logo: logo.svg
  tier: official
  author: upsetdev
  homepage: https://js.wiki
  version: 1.0.0
  appVersion: "2.5.314"
  minPyoVersion: 0.1.0
  kind: application
  database:
    engine: postgres
    extensions: [pg_trgm]
    env:
      DB_HOST: POSTGRES_HOST
      DB_PORT: POSTGRES_PORT
      DB_USER: POSTGRES_USER
      DB_PASS: POSTGRES_PASSWORD
      DB_NAME: POSTGRES_DATABASE
  hints:
    - Add a domain, then create the admin account in the setup there.
    - Pages live in the database.

services:
  wiki-js:
    image: ghcr.io/requarks/wiki:2.5.314@sha256:68f0d1848261ae76492ba358e30a96a76fed5d97a3fff381656082bf90f70d7e
    environment:
      DB_TYPE: postgres
    expose: [ "3000" ]
    healthcheck:
      start_period: 30s
      interval: 10s
      x-pyo: { http: { path: /healthz, port: 3000 } }
    deploy:
      replicas: 1
      resources:
        reservations: { cpus: "0.1", memory: 256M }
        limits: { cpus: "1", memory: 1G }
    x-pyo:
      expose:
        - { name: http, port: 3000, as: http }
